services:
  awg:
    build: ./edge_awg
    env_file:
      - .env.edge
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    volumes:
      - awg_config:/etc/amnezia/amneziawg
      - awg_wireguard_compat:/etc/wireguard
      - awg_client_configs:/root/vpn-configs
      - awg_runtime:/var/run/wireguard
      - awg_amnezia_runtime:/run/amneziawg
      - /lib/modules:/lib/modules:ro
    ports:
      - "${AWG_PORT:-51820}:${AWG_PORT:-51820}/udp"
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  edge-agent:
    build: ./edge_agent
    env_file:
      - .env.edge
    cap_add:
      - NET_ADMIN
    volumes:
      - edge_agent_state:/var/lib/edge-agent
      - awg_config:/etc/amnezia/amneziawg
      - awg_wireguard_compat:/etc/wireguard
      - awg_client_configs:/root/vpn-configs
      - awg_runtime:/var/run/wireguard
      - awg_amnezia_runtime:/run/amneziawg
    depends_on:
      - awg
    network_mode: "service:awg"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  awg_config:
  awg_wireguard_compat:
  awg_client_configs:
  awg_runtime:
  awg_amnezia_runtime:
  edge_agent_state:
